name: CI

# 轻量 CI：仅在 push/PR 验证前端（lint / 类型 / 构建）。
# Rust 检查与 macOS/Windows 构建只在发版时执行（见 release-reusable.yml）。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端（lint + 类型检查 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npm run lint
      - run: npm run test
      - run: npm run build
