name: Release

# 可复用发布流程：由 fork 通过 workflow_call 调用（见 fork 的 release.yml）。
# 也支持在 base 本仓库 workflow_dispatch 手动触发（用于流程自测，不创建 Release）。
#
# 产物：各平台安装包与 .sig + release/latest.json + release/checksums.txt，
# 上传为 Actions artifact；create-release 为 true 时另建 GitHub Release 归档。

on:
  workflow_call:
    inputs:
      version:
        description: 版本号 x.y.z（留空则由触发 tag 推导）
        required: false
        type: string
        default: ''
      base-url:
        description: 更新服务器基础地址（latest.json 所在目录）
        required: true
        type: string
      pre-build:
        description: tauri build 前执行的命令（如预取字体/模型）
        required: false
        type: string
        default: ''
      native-cpp:
        description: 是否安装 C++/bindgen 依赖（Windows libclang / macOS CXXFLAGS）
        required: false
        type: boolean
        default: false
      create-release:
        description: 是否创建 GitHub Release 归档
        required: false
        type: boolean
        default: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: 版本号 x.y.z（留空则由当前 ref 推导）
        required: false
        type: string
        default: ''
      base-url:
        description: 更新服务器基础地址
        required: true
        type: string
      pre-build:
        description: tauri build 前执行的命令
        required: false
        type: string
        default: ''
      native-cpp:
        description: 安装 C++/bindgen 依赖
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: 解析版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt 检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: 解析并校验版本
        id: version
        shell: bash
        run: |
          raw="${{ inputs.version }}"
          if [ -z "$raw" ]; then raw="${GITHUB_REF_NAME}"; fi
          ver="${raw#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$ver" != "$conf" ]; then
            echo "::error::版本不一致：输入/tag=$ver，tauri.conf.json=$conf"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "版本：$ver"

  build:
    name: 构建（${{ matrix.os }}）
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: 启用 sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: 安装依赖
        shell: bash
        run: npm ci
        env:
          HUSKY: 0
      - name: 安装 LLVM（Windows，native-cpp）
        if: ${{ inputs.native-cpp && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: 设置 C++ 头文件路径（macOS，native-cpp）
        if: ${{ inputs.native-cpp && runner.os == 'macOS' }}
        shell: bash
        run: echo "CXXFLAGS=-std=c++14 -I$(xcrun --sdk macosx --show-sdk-path)/usr/include/c++/v1" >> "$GITHUB_ENV"
      - name: 预构建步骤
        if: ${{ inputs.pre-build != '' }}
        shell: bash
        run: ${{ inputs.pre-build }}
      - name: 构建并签名
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: 收集发布产物
        shell: bash
        run: |
          mkdir -p release-out
          find src-tauri/target -type f \
            \( -name '*.tar.gz' -o -name '*.tar.gz.sig' \
               -o -name '*.nsis.zip' -o -name '*.nsis.zip.sig' \
               -o -name '*.exe' -o -name '*.exe.sig' \
               -o -name '*.msi' -o -name '*.msi.sig' -o -name '*.dmg' \) \
            -exec cp -f {} release-out/ \;
          echo "收集到："
          ls -la release-out
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-out
          if-no-files-found: error

  release:
    name: 归档 Release
    needs: [prepare, build]
    if: ${{ inputs.create-release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 生成统一更新清单
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r -d '' f; do
            case "$f" in *x86_64*|*intel*) k=darwin-x86_64;; *) k=darwin-aarch64;; esac
            args+=(--platform "$k=$f")
          done < <(find "$PWD/artifacts" -type f -name '*.app.tar.gz' -print0)
          while IFS= read -r -d '' f; do
            args+=(--platform "windows-x86_64=$f")
          done < <(find "$PWD/artifacts" -type f -name '*-setup.exe' -print0)
          while IFS= read -r -d '' f; do
            args+=(--platform "linux-x86_64=$f")
          done < <(find "$PWD/artifacts" -type f -name '*.AppImage.tar.gz' -print0)
          if [ ${#args[@]} -eq 0 ]; then echo "::error::未找到可发布安装包"; exit 1; fi
          node scripts/release.mjs \
            --base-url "${{ inputs.base-url }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --changelog src/content/changelog.md \
            "${args[@]}"
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/**/*
            release/*
