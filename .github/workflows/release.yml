name: Release

# 调用 base 的可复用发布流程（PocketArk/.github/workflows/release-reusable.yml）。
# 触发：推送 vX.Y.Z tag（自动）或手动 workflow_dispatch。
# base-url 缺省取仓库 Variable UPDATE_BASE_URL；签名密钥走仓库 Secrets。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 版本号 x.y.z（留空则由当前 ref 推导）
        required: false
        type: string
        default: ''
      base-url:
        description: 更新服务器地址（缺省用 Variable UPDATE_BASE_URL）
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    uses: hmilyld/PocketArk/.github/workflows/release-reusable.yml@main
    with:
      version: ${{ inputs.version }}
      base-url: ${{ inputs.base-url || vars.UPDATE_BASE_URL }}
      pre-build: 'npm run fonts && npm run ocr-models'
      native-cpp: true
      create-release: true
    secrets: inherit
